name: frontend_ai_resume_screening
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Cupertino Icons
  cupertino_icons: ^1.0.8

  # Resume file selection
  file_picker: ^8.1.7

  # Backend API calls
  http: ^1.2.2

  # Save login token and user session
  shared_preferences: ^2.3.2

  # Open PDF download URL in browser
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true